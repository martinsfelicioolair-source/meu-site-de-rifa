<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa Online - Concorra a Prémios Incríveis!</title>
  <style>
    :root {
      --primary: #10b981;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; padding: 20px; }
    .container { max-width: 450px; width: 100%; background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 20px; margin-bottom: 10px; text-align: center; }
    .price-tag { color: var(--primary); font-size: 18px; margin-bottom: 15px; text-align: center; }
    .quick-select { display: flex; gap: 8px; margin: 15px 0; justify-content: center; }
    .btn-qty { background: #334155; color: white; border: 2px solid transparent; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-qty:hover { border-color: var(--primary); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
    .btn-submit { width: 100%; background: var(--primary); color: #000; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    /* ÁREA DO PIX */
    #pix-area { display: none; text-align: center; margin-top: 20px; border-top: 1px solid #334155; padding-top: 20px; }
    #qr-code-img { width: 200px; height: 200px; border-radius: 8px; margin: 15px 0; }
    textarea { width: 100%; height: 70px; background: #0f172a; color: #10b981; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 11px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📱 Concorra a um iPhone 15 Pro Max</h1>
    <p class="price-tag">Por apenas <strong>R$ 0,50</strong> / cota</p>
    
    <div class="quick-select">
      <button class="btn-qty" onclick="selectCotas(5)">+5 Cotas</button>
      <button class="btn-qty" onclick="selectCotas(10)">+10 Cotas</button>
      <button class="btn-qty" onclick="selectCotas(50)">+50 Cotas</button>
    </div>

    <form id="purchaseForm" onsubmit="gerarPix(event)">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" required placeholder="Digite o seu nome">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>WhatsApp / Telemóvel</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
      </div>
      
      <p style="margin-bottom: 15px; font-size: 18px; text-align: center;">
        Total (<span id="qty-display">10</span> cotas): <strong id="total-price" style="color:var(--primary)">R$ 5,00</strong>
      </p>
      
      <button type="submit" class="btn-submit" id="btn-pagar">⚡ GERAR PIX PARA PAGAR</button>
    </form>

    <!-- Área onde o QR Code e o Código Pix aparecem -->
    <div id="pix-area">
      <h3 style="color: var(--primary);">Pix Gerado com Sucesso!</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Escaneie o QR Code ou copie o código abaixo:</p>
      
      <img id="qr-code-img" src="" alt="QR Code Pix">
      
      <textarea id="pix-code" readonly></textarea>
      
      <button class="btn-submit" style="margin-top: 10px; background: #38bdf8;" onclick="copiarPix()">Copiar Código Pix Copia e Cola</button>
    </div>
  </div>

  <script>
    // Link do seu servidor no Render
    const URL_DO_SERVIDOR = 'https://servidor-rifa-pix.onrender.com';

    let cotasSelecionadas = 10;
    const PRECO_COTA = 0.50;

    function selectCotas(qty) {
      cotasSelecionadas = qty;
      document.getElementById('qty-display').innerText = qty;
      const total = (qty * PRECO_COTA).toFixed(2).replace('.', ',');
      document.getElementById('total-price').innerText = `R$ ${total}`;
    }

    async function gerarPix(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btn-pagar');
      btn.innerText = "A processar Pix...";
      btn.disabled = true;

      const dados = {
        valor: (cotasSelecionadas * PRECO_COTA).toFixed(2),
        descricao: `Rifa - ${cotasSelecionadas} cotas`,
        email: document.getElementById('email').value,
        nome: document.getElementById('nome').value,
        telefone: document.getElementById('telefone').value
      };

      try {
        const resposta = await fetch(`${URL_DO_SERVIDOR}/api/criar-pix`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (resultado.sucesso) {
          document.getElementById('qr-code-img').src = `data:image/jpeg;base64,${resultado.qrCodeBase64}`;
          document.getElementById('pix-code').value = resultado.qrCode;
          document.getElementById('pix-area').style.display = 'block';
          btn.innerText = "Pix Gerado Abaixo 👇";
        } else {
          alert('Erro ao gerar o Pix. Verifique os dados ou tente novamente!');
          btn.disabled = false;
          btn.innerText = "⚡ GERAR PIX PARA PAGAR";
        }
      } catch (error) {
        alert('Erro ao conectar com o servidor!');
        btn.disabled = false;
        btn.innerText = "⚡ GERAR PIX PARA PAGAR";
      }
    }

    function copiarPix() {
      const pixCode = document.getElementById('pix-code');
      pixCode.select();
      document.execCommand('copy');
      alert('Código Pix copiado com sucesso!');
    }
  </script>

</body>
</html>
